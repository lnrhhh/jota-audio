<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alles Gute! </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .btn { background: linear-gradient(135deg, #f43f5e, #fb7185); color: white; border: none; padding: 24px 36px; font-size: 1.3rem; font-weight: bold; border-radius: 999px; cursor: pointer; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    #content { display: none; }
    audio { margin-top: 24px; width: 100%; max-width: 320px; }
  </style>
</head>
<body>
  <button id="playBtn" class="btn" onclick="startAudio()">Tippen zum Öffnen</button>
  <div id="content">
    <h1> Du wurdest gebrechstangt! </h1>
    <audio id="myAudio" controls preload="auto">
      <source src="audio.mp3" type="audio/mpeg">
    </audio>
  </div>
  <script>
    function startAudio() {
      const audio = document.getElementById('myAudio');
      audio.play().then(() => {
        document.getElementById('playBtn').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      }).catch(() => {
        document.getElementById('playBtn').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      });
    }
  </script>
</body>
</html>
